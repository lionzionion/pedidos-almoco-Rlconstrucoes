name: RL Pedidos | Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    name: Validar cardápio, identidade, cadastro, relatórios e links
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes
        run: node --test tests/*.test.cjs
